name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic qualification demo (expected findings)
        shell: bash
        run: |
          set +e
          python -m healthqualify.cli run examples/synthetic_lis/protocol.json --out /tmp/healthqualify-ci
          code=$?
          set -e
          test "$code" -eq 1
          python -m healthqualify.cli verify /tmp/healthqualify-ci
