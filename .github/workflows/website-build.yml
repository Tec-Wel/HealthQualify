name: HealthQualify website and docs — free static build
on:
  pull_request:
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs/**'
      - 'docs_hooks.py'
      - 'requirements-docs.txt'
      - '.github/workflows/website-build.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs/**'
      - 'docs_hooks.py'
      - 'requirements-docs.txt'
      - '.github/workflows/website-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    name: Combined Astro + MkDocs static preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install free documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Install Astro with project-local dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Run static website contract checks
        working-directory: website
        run: npm test
      - name: Build Astro landing site (GitHub Pages base path)
        working-directory: website
        run: npm run build
      - name: Build searchable MkDocs portal at /docs/
        run: python -m mkdocs build --site-dir website/dist/docs
      - name: Install free browser QA tooling and Chromium
        run: |
          cd website
          npm install --no-save --package-lock=false 'playwright@^1.56.0' '@axe-core/playwright@^4.11.0'
          npx playwright install --with-deps chromium
      - name: Capture actual synthetic Local Edition screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview/HealthQualify"
          cp -R website/dist/. "$RUNNER_TEMP/preview/HealthQualify/"
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/preview" >/tmp/hq-site-preview.log 2>&1 &
          echo $! >/tmp/hq-site-preview.pid
          trap 'kill "$(cat /tmp/hq-site-preview.pid)" 2>/dev/null || true' EXIT
          SITE_URL=http://127.0.0.1:8765/HealthQualify/ node website/tests/browser-qa.mjs
          mkdir -p website/dist/product-images
          cp website/screenshots-preview/actual-local-*.png website/dist/product-images/
      - name: Verify combined static output and internal navigation
        run: python scripts/verify_website_build.py
      - name: Archive preview — not public deployment
        uses: actions/upload-artifact@v7
        with:
          name: healthqualify-astro-mkdocs-preview
          path: website/dist/
          retention-days: 14
      - name: Confirm public launch remains gated
        run: |
          echo "Built static site only. Public GitHub Pages publication requires separate owner/legal/security approval." >> "$GITHUB_STEP_SUMMARY"
