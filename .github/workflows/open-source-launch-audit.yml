name: Open-source launch readiness (advisory)
on:
  pull_request:
    paths:
      - 'PRIVACY.md'
      - 'DISCLAIMER.md'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CODE_OF_CONDUCT.md'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/PUBLIC_LAUNCH_READINESS.md'
      - '.github/workflows/open-source-launch-audit.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify required policy content and offline license gate
        run: python scripts/check_launch_readiness.py
      - name: Recheck tests
        run: python -m unittest discover -s tests -q
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate source-tree SPDX SBOM (not binary/model completeness)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: healthqualify-source.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: healthqualify-preliminary-source-sbom
          path: healthqualify-source.spdx.json
          retention-days: 30
  historical-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks OSS binary from reviewed source release
        env:
          GH_API: https://api.github.com
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan Git history (findings not uploaded as public artifacts)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .
  hardening-advice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python requirements vulnerability checks (optional environment)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip install -r requirements-security.txt -r requirements-docs.txt
          python -m pip_audit --local
