name: Open-source launch readiness (advisory)
on:
  pull_request:
    paths:
      - 'PRIVACY.md'
      - 'DISCLAIMER.md'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CODE_OF_CONDUCT.md'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/PUBLIC_LAUNCH_READINESS.md'
      - '.github/workflows/open-source-launch-audit.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify required policy content and offline license gate
        run: python scripts/check_launch_readiness.py
      - name: Install test dependencies
        run: python -m pip install pytest -r requirements-security.txt
      - name: Recheck tests
        run: python -m unittest discover -s tests -q
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate source-tree SPDX SBOM (not binary/model completeness)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: healthqualify-source.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: healthqualify-preliminary-source-sbom
          path: healthqualify-source.spdx.json
          retention-days: 30
  historical-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks OSS binary from reviewed source release
        env:
          GH_API: https://api.github.com
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan Git history (human triage required for any detection)
        shell: bash
        run: |
          set +e
          set -uo pipefail
          /tmp/gitleaks git --no-banner --redact --exit-code 1 \
            --report-format json --report-path /tmp/healthqualify-gitleaks.json . 
          outcome=$?
          if [ "$outcome" -ne 0 ]; then
            echo "::warning title=PUBLICATION HOLD::Git history scan detected possible secrets. Review privately and rotate/rewrite if necessary before public visibility."
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/healthqualify-gitleaks.json")
          rows=json.loads(p.read_text()) if p.exists() else []
          print("Historical secret findings (sensitive values redacted; locations for private review):",len(rows))
          for i,row in enumerate(rows,1):
              print(i, "file=",row.get("File","unknown"),"rule=",row.get("RuleID","unknown"),
                    "commit=",str(row.get("Commit",""))[:12])
          PY
            echo "### Public-launch HOLD — secret scan requires private triage" >> "$GITHUB_STEP_SUMMARY"
            echo "Automated history scan flagged potential credentials. Treat all findings as unresolved until independently reviewed; do not publish the repository." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "History scan did not detect supported secret patterns. Manual IP/PHI review remains mandatory." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Advisory only: the explicit publication checklist is intentionally
          # BLOCKED until human review, even if this CI job itself completes.
          exit 0
  hardening-advice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python requirements vulnerability checks (optional environment)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip install -r requirements-security.txt -r requirements-docs.txt
          python -m pip_audit --local
