name: Equal-input synthetic benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest baseline runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Run three implementations with identical synthetic inputs
        run: python -m benchmarks.compare --repetitions 3 --out benchmark-results.json
      - name: Publish measured machine-readable report
        uses: actions/upload-artifact@v4
        with:
          name: healthqualify-equal-input-benchmark
          path: benchmark-results.json
          retention-days: 90
