name: Release qualification advisory
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing repository tag to analyze"
        required: true
        type: string
permissions:
  contents: read
jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Calculate conservative release test recommendations
        env:
          HQ_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          HQ_RELEASE_OUTPUT: ${{ runner.temp }}/release-impact.json
        run: python -m healthqualify.release_ci
      - name: Upload unsigned review package (never approval)
        uses: actions/upload-artifact@v7
        with:
          name: qualification-impact-advisory
          path: ${{ runner.temp }}/release-impact.json
          retention-days: 30
