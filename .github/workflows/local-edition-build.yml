name: Local Edition — standalone desktop bundles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-edition-build.yml'
      - 'healthqualify/local_edition_v08.py'
      - 'healthqualify/local_ui_v08.*'
      - 'scripts/local_entry_v08.py'
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install standalone bundler
        run: python -m pip install 'pyinstaller>=6,<7'
      - name: Package local app, assets and synthetic fixtures
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name HealthQualifyLocal \
            --add-data "healthqualify/local_ui_v08.html:healthqualify" \
            --add-data "healthqualify/local_ui_v08.js:healthqualify" \
            --add-data "healthqualify/local_ui_v08.css:healthqualify" \
            --add-data "examples/synthetic_lis_v2/protocol.json:examples/synthetic_lis_v2" \
            --add-data "examples/synthetic_lis_v3/protocol.json:examples/synthetic_lis_v3" \
            scripts/local_entry_v08.py
      - name: Confirm standalone CLI starts
        shell: bash
        run: |
          if [ -f dist/HealthQualifyLocal.exe ]; then
            dist/HealthQualifyLocal.exe --help
          else
            dist/HealthQualifyLocal --help
          fi
      - name: Publish developer-alpha binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: healthqualify-local-${{ matrix.os }}
          path: dist/HealthQualifyLocal*
          retention-days: 30
