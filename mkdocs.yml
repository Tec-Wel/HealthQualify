site_name: HealthQualify
site_description: Local-first software qualification, evidence, and AI investigation — synthetic developer alpha
site_url: https://tec-wel.github.io/HealthQualify/docs/
repo_name: Tec-Wel/HealthQualify
repo_url: https://github.com/Tec-Wel/HealthQualify
edit_uri: edit/main/docs/
docs_dir: docs
hooks:
  - docs_hooks.py
use_directory_urls: true

theme:
  name: material
  language: en
  logo: null
  favicon: null
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start Here:
      - Get started: GETTING_STARTED.md
      - Installation: INSTALLATION.md
      - Evaluation: EVALUATION_GUIDE.md
      - All guides: DOCUMENTATION_INDEX.md
  - AI Agents:
      - Five investigators: AI_AGENTS_GUIDE.md
      - Local dashboard: AI_AGENT_DASHBOARD.md
  - Qualification:
      - User guide: USER_GUIDE.md
      - End-to-end workflow: END_TO_END_WORKFLOW.md
      - Examples: EXAMPLES.md
      - Evidence verification: VERIFICATION_GUIDE.md
      - Healthcare use cases: HEALTHCARE_USE_CASES.md
      - Qualification methodology: QUALIFICATION_METHODOLOGY.md
      - Templates: VALIDATION_TEMPLATES.md
  - Developer:
      - CLI reference: CLI_REFERENCE.md
      - API reference: API_REFERENCE.md
      - Configuration: CONFIGURATION.md
      - Architecture: DEVELOPER_ARCHITECTURE.md
      - Custom adapters: CUSTOM_ADAPTER_GUIDE.md
      - Integrations: INTEGRATION_GUIDE.md
      - Tests & CI: TESTING_AND_CI.md
  - Security & Operations:
      - Feature matrix: FEATURE_MATRIX.md
      - Security model: SECURITY_MODEL.md
      - Production-readiness gates: PRODUCTION_READINESS_CHECKLIST.md
      - Deployment: DEPLOYMENT_GUIDE.md
      - Operations: OPERATIONS_RUNBOOK.md
      - Troubleshooting: TROUBLESHOOTING.md
      - FAQ: FAQ.md
      - Regulatory mapping: REGULATORY_MAPPING.md
      - Site setup & costs: DOCS_SITE_SETUP.md
  - Public launch & policies:
      - Readiness and legal review: PUBLIC_LAUNCH_READINESS.md
      - Privacy and data handling: privacy-policy.md
      - Safety / regulatory disclaimer: disclaimer-policy.md
      - Third-party licensing: third-party-notices.md
      - Community and contributor policy: community-governance.md
  - Contributing:
      - Visual contribution guide: CONTRIBUTOR_VISUAL_GUIDE.md
      - Design system: DESIGN_GUIDELINES.md
      - Screenshot guide: VISUAL_ASSETS_GUIDE.md
      - Release presentation: RELEASE_PRESENTATION_TEMPLATE.md
      - Migration guide: MIGRATION_GUIDE.md
      - Versioning policy: VERSIONING_POLICY.md
