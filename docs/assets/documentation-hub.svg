<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-labelledby="title desc">
<title id="title">HealthQualify documentation — three learning paths</title>
<desc id="desc">A dark navy documentation header with three learning paths: Discover, Run and Verify, and Build and Extend.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101c34"/><stop offset=".6" stop-color="#172f49"/><stop offset="1" stop-color="#123c49"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57e5cf"/><stop offset="1" stop-color="#73b6ff"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e8fcff" stroke-opacity=".042"/></pattern>
</defs>
<rect width="1200" height="326" rx="22" fill="url(#bg)"/>
<rect width="1200" height="326" rx="22" fill="url(#grid)"/>
<path d="M 1010 -100 C 850 80 1150 190 1180 340" fill="none" stroke="#66dacf" stroke-opacity=".1" stroke-width="120"/>
<rect x="46" y="36" width="154" height="27" rx="13.5" fill="#43bba7" fill-opacity=".16" stroke="#67dec9" stroke-opacity=".5"/>
<text x="65" y="54" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.3" fill="#9cf9e9">START EXPLORING</text>
<text x="46" y="107" font-size="37" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#f8fbff">Your route to confident qualification.</text>
<text x="47" y="135" font-size="17" font-family="Arial,Helvetica,sans-serif" fill="#bfd4e6">Choose your path. Learn the workflow. Verify every result.</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="46" y="169" width="347" height="113" rx="12" fill="#f4fbff" fill-opacity=".075" stroke="#b7e9ec" stroke-opacity=".25"/>
<circle cx="76" cy="204" r="15" fill="#58e0cb" fill-opacity=".17" stroke="#58e0cb"/>
<text x="70" y="210" font-size="17" font-weight="700" fill="#79f7df">1</text>
<text x="103" y="207" font-size="20" font-weight="700" fill="#f9ffff">Discover</text>
<text x="64" y="239" font-size="15" fill="#bfd4e6">Understand the platform</text>
<text x="64" y="259" font-size="15" fill="#bfd4e6">and install locally.</text>
<rect x="414" y="169" width="348" height="113" rx="12" fill="#f4fbff" fill-opacity=".075" stroke="#b7e9ec" stroke-opacity=".25"/>
<circle cx="444" cy="204" r="15" fill="#5caeff" fill-opacity=".17" stroke="#7cc2ff"/>
<text x="439" y="210" font-size="17" font-weight="700" fill="#91ccff">2</text>
<text x="471" y="207" font-size="20" font-weight="700" fill="#f9ffff">Run &amp; verify</text>
<text x="432" y="239" font-size="15" fill="#bfd4e6">Execute synthetic tests.</text>
<text x="432" y="259" font-size="15" fill="#bfd4e6">Inspect traceable evidence.</text>
<rect x="783" y="169" width="370" height="113" rx="12" fill="#f4fbff" fill-opacity=".075" stroke="#b7e9ec" stroke-opacity=".25"/>
<circle cx="814" cy="204" r="15" fill="#b4a0ff" fill-opacity=".17" stroke="#c1b3ff"/>
<text x="809" y="210" font-size="17" font-weight="700" fill="#d3caff">3</text>
<text x="842" y="207" font-size="20" font-weight="700" fill="#f9ffff">Build &amp; extend</text>
<text x="801" y="239" font-size="15" fill="#bfd4e6">Connect safe test adapters.</text>
<text x="801" y="259" font-size="15" fill="#bfd4e6">Understand APIs and CI.</text>
</g>
<rect x="46" y="304" width="1107" height="2" rx="1" fill="url(#accent)" opacity=".65"/>
</svg>
