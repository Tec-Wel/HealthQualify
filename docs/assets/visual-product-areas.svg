<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">HealthQualify two connected product areas</title><desc id="d">Advisory AI investigations feed human review alongside deterministic qualification tests and evidence.</desc><rect width="1200" height="410" rx="24" fill="#F4F9FC"/><g font-family="Arial,sans-serif"><text x="45" y="48" font-size="24" fill="#102B45" font-weight="700">Two connected workflows. One evidence trail.</text><rect x="45" y="82" width="512" height="235" rx="18" fill="#102B45"/><text x="74" y="126" font-size="14" font-weight="700" fill="#68E4C8">01 / AI INVESTIGATIONS</text><text x="74" y="161" font-size="24" font-weight="700" fill="white">Understand the change</text><g font-size="16" fill="#D9EAF1"><text x="74" y="205">Release impact · Qualification gaps</text><text x="74" y="237">Failure review · Evidence readiness</text><text x="74" y="269">Cross-system dependencies</text></g><rect x="644" y="82" width="512" height="235" rx="18" fill="#E1F3EF" stroke="#B0DAD2"/><text x="673" y="126" font-size="14" font-weight="700" fill="#0C8579">02 / QUALIFICATION</text><text x="673" y="161" font-size="24" font-weight="700" fill="#102B45">Verify the evidence</text><g font-size="16" fill="#2E5365"><text x="673" y="205">Requirements · Risk · Tests</text><text x="673" y="237">Deterministic execution · Evidence</text><text x="673" y="269">Conservative requalification</text></g><path d="M566 198h67" stroke="#0C8579" stroke-width="5"/><path d="M627 188l12 10-12 10" fill="none" stroke="#0C8579" stroke-width="5"/><rect x="367" y="341" width="468" height="45" rx="22" fill="#FFFFFF" stroke="#9BBFBC"/><text x="601" y="369" font-size="16" text-anchor="middle" font-weight="700" fill="#18495A">Human review · No automatic approval</text></g></svg>