  <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253A57"/><stop offset="1" stop-color="#162941"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
