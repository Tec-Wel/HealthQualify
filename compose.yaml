# Local-only development service. Do not expose to a public network.
services:
  healthqualify:
    build: .
    command: ["python", "-m", "healthqualify.appcli", "--db", "/data/healthqualify.db", "serve", "--port", "8765"]
    environment:
      HEALTHQUALIFY_API_TOKEN: "${HEALTHQUALIFY_API_TOKEN:?Set a random 32+ character token}"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - healthqualify_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  healthqualify_data:
